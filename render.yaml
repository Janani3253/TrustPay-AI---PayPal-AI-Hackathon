# Render Infrastructure Blueprint for TrustPay AI Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: trustpay-ai-backend
    env: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false # Set manually to your existing Render PostgreSQL Internal Connection String
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TRUSTPAY_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_BASE_URL
        value: "http://localhost:5173"
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox

